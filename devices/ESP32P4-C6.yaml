external_components:
  - source:
      type: git
      url: https://github.com/marcocastellani/esphome
      ref: gsl3680
    refresh: 0s
    components: [mipi_dsi, gsl3680]

esp32:
  board: esp32-p4-evboard
  flash_size: 16MB
  cpu_frequency: 400MHz
  framework:
    type: esp-idf
    # Rimuovi version e platform_version per usare quelle raccomandate
    advanced:
      enable_idf_experimental_features: yes

# ======== Wi-Fi via ESP-Hosted (co-processore ESP32-C6) ========
# Compila questi pin secondo lo schema della tua board (bus SDIO)
esp32_hosted:
  variant: ESP32C6 # C6 è il caso più comune; usa quello effettivo se diverso
  # SDIO (obbligatorio per transport=SDIO)
  clk_pin: GPIO18 # SDIO CLK dal P4 al C6
  cmd_pin: GPIO19 # SDIO CMD
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  # Reset/enable del co-processore
  reset_pin: GPIO54
  active_high: true # spesso il reset è attivo alto; inverti se necessario
  # slot: 1                 # opzionale: lascia 1 se non sai

display:
  - platform: mipi_dsi
    model: jd9365
    id: mydisplay

psram:
  speed: 200MHz

i2c:
  sda: 7
  scl: 8
  scan: false
  id: i2c_bus
  frequency: 400kHz # Frequenza bassa ma ragionevole per ESP32-P4
  timeout: 1000ms # Timeout molto più lungo per operazioni lente

esp_ldo:
  - channel: 3
    voltage: 2.5V

