touchscreen:
  - platform: gsl3680
    id: touch_screen
    i2c_id: i2c_bus
    reset_pin:
      number: 22
      mode:
        output: true
        pullup: true

    interrupt_pin:
      number: 21
      mode:
        output: true
    on_touch:
      - logger.log:
          format: "Touch detected at (%d, %d)"
          args: ["touch.x", "touch.y"]

